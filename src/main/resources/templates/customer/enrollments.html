<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>My Enrollments | E-Learning</title>
<link rel="stylesheet" th:href="@{/css/courses.css}">
<script th:src="@{/js/student-enrollments.js}" defer></script>
</head>
<body>

<nav class="navbar">
	<a th:href="@{/courses}" class="brand">E-Learning</a>
	<div class="nav-links">
		<a th:href="@{/}">Home</a>
		<a th:href="@{/student/courses}">Courses</a>
		<a th:href="@{/student/enrollments}" class="active">My Enrollments</a>
		<a th:href="@{/login}">Login</a>
	</div>
</nav>

<main class="page">
	<h1 class="page-title">My Enrollments</h1>
	<p class="page-subtitle">Courses you are currently enrolled in.</p>

	<section class="panel">
		<h2 class="panel-title">Enrolled Courses</h2>
		<div class="table-container">
			<table>
				<thead>
				<tr>
					<th>ID</th>
					<th>Course</th>
					<th>Status</th>
					<th>Enrolled Date</th>
				</tr>
				</thead>
				<tbody id="enrollment-table-body">
				</tbody>
			</table>
		</div>
	</section>
</main>

</body>
</html>
