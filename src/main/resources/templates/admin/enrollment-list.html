<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
<title>Enrollment Admin | E-Learning</title>
<link rel="stylesheet" th:href="@{/css/courses.css}">
<script th:src="@{/js/enrollment-list.js}" defer></script>
</head>
<body>

<nav class="navbar">
	<a th:href="@{/admin/dashboard}" class="brand">E-Learning</a>
	<div class="nav-links">
		<a th:href="@{/admin/courses}" class="active">Courses</a>
		<a th:href="@{/login}">Login</a>
		<a th:href="@{/admin/categories}">Categories</a>
	</div>
</nav>

<main class="page">
	<h1 class="page-title">Enrollment Admin</h1>
	<p class="page-subtitle">Enrollment list</p>
	<div id="message" class="message" hidden></div>

	<section class="panel">
		<div class="table-container">
			<table>
				<thead>
				<tr>
					<th>ID</th>
					<th>Student</th>
					<th>Course Title</th>
					<th>Enrolled Date</th>
					<th>Status</th>
				</tr>
				</thead>
				<tbody id="enrollment-table-body">
				</tbody>
			</table>
		</div>
	</section>
</main>

</body>
</html>
